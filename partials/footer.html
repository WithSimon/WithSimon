    <!-- Shared: menu + active nav + back to top -->
    <script>
        function toggleMobileMenu() {
            var menu = document.getElementById('mobileMenu');
            var btn = document.querySelector('.mobile-menu-btn');
            menu.classList.toggle('open');
            document.getElementById('mobileMenuOverlay').classList.toggle('open');
            var isOpen = menu.classList.contains('open');
            if (btn) btn.setAttribute('aria-expanded', isOpen);
            document.body.style.overflow = isOpen ? 'hidden' : '';
        }
        document.addEventListener('DOMContentLoaded', function() {
            var path = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link, .mobile-nav-link').forEach(function(a) {
                var href = (a.getAttribute('href') || '').replace(/^.*\//, '');
                if (href === path || (path === '' && href === 'index.html')) a.classList.add('active');
            });
            document.querySelectorAll('.back-to-top').forEach(function(el) {
                el.addEventListener('click', function(e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
            });
            var footer = document.querySelector('.footer');
            var backToTopBtns = document.querySelectorAll('.back-to-top');
            if (footer && backToTopBtns.length && 'IntersectionObserver' in window) {
                var observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        backToTopBtns.forEach(function(btn) {
                            if (entry.isIntersecting) {
                                btn.classList.add('visible');
                            } else {
                                btn.classList.remove('visible');
                            }
                        });
                    });
                }, { threshold: 0.1 });
                observer.observe(footer);
            }
        });
    </script>
