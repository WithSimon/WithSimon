    <!-- Duck Quack Easter Egg -->
    <script>
    (function() {
        var duck = document.getElementById('logoDuck');
        if (!duck) return;

        var quackSound = new Audio('assets/sound/quack.mp3');

        function quack() {
            quackSound.currentTime = 0;
            quackSound.play();
        }

        duck.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            quack();
            duck.style.transition = 'transform 0.1s';
            duck.style.transform = 'rotate(-15deg)';
            setTimeout(function() { duck.style.transform = 'rotate(10deg)'; }, 100);
            setTimeout(function() { duck.style.transform = 'rotate(-5deg)'; }, 200);
            setTimeout(function() { duck.style.transform = 'rotate(0deg)'; }, 300);
        });
    })();
    </script>
